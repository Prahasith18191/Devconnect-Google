<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevConnect AI — Event Networking Platform</title>
    <meta name="description" content="Event networking and developer community platform for Build with AI Hyderabad." />
    <meta property="og:title" content="DevConnect AI — Event Networking Platform" />
    <meta property="og:description" content="Event networking and developer community platform for Build with AI Hyderabad." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--ag-bg)] text-[var(--ag-text)] antialiased font-sans selection:bg-[#4285F4] selection:text-white">
    <script>
      // No-flash theme init — set [data-theme] before React mounts.
      (function () {
        try {
          var t = localStorage.getItem('devconnect_theme')
            || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
